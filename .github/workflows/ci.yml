name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-mcp:
    name: MCP Server Tests & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx --prefix mcp-server playwright install --with-deps chromium

      - name: Type Check
        run: npm run --prefix mcp-server lint

      - name: Run Vitest Suite
        run: npm --prefix mcp-server test

      - name: Build Distribution
        run: npm run --prefix mcp-server build

  test-addon:
    name: HA App Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run Pytest Suite with Coverage Enforcement
        run: uv run --directory ha-mcp-helper --extra dev pytest tests --cov=app.core.policy --cov=app.services.audit_service --cov-report=term-missing --cov-fail-under=100
